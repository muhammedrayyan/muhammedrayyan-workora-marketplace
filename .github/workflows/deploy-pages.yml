name: Deploy GoWorkora to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize static deployment artifact
        run: npm run static:sync

      - name: Verify static deployment source
        run: npm run static:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Run automated tests
        run: npm run test:run

      - name: Generate production browser configuration
        run: npm run config:generate -- --root github-pages-dist
        env:
          GOWORKORA_PUBLIC_ENVIRONMENT: production
          GOWORKORA_PUBLIC_SITE_URL: https://www.goworkora.com
          GOWORKORA_PUBLIC_BASE_PATH: /
          GOWORKORA_SUPABASE_URL: https://zjkoravrmiieclneepiy.supabase.co
          GOWORKORA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.GOWORKORA_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          GOWORKORA_BUILD_ID: ${{ github.sha }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
